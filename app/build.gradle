plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kilospace.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.kilospace.app"
        minSdk 24
        targetSdk 35
        versionCode 10025
        versionName "1.2.5.10"
        ndkVersion "25.1.8937393"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "com.google.android.gms:play-services-base:18.5.0"
    implementation "com.google.android.gms:play-services-basement:18.4.0"
    implementation "com.google.android.gms:play-services-ads:24.6.0"
    implementation "com.google.android.gms:play-services-ads-identifier:18.0.0"
    implementation "com.google.android.gms:play-services-appset:16.0.1"
    implementation "com.google.android.gms:play-services-tasks:18.2.0"
    implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1"
    implementation "com.google.mlkit:barcode-scanning-common:17.0.0"
    implementation "com.google.android.gms:play-services-vision-common:17.3.0"
    implementation "com.google.android.gms:play-services-vision:20.0.0"
    implementation "com.google.firebase:firebase-components:16.1.0"
    implementation "com.google.firebase:firebase-annotations:16.0.0"
    implementation "com.google.firebase:firebase-encoders:16.1.0"
    implementation "com.google.firebase:firebase-encoders-json:17.1.0"
    implementation "com.google.android.datatransport:transport-api:2.2.1"
    implementation "com.google.android.datatransport:transport-backend-cct:2.3.3"
    implementation "com.google.android.datatransport:transport-runtime:2.2.6"
    implementation "com.google.android.gms:play-services-measurement-base:20.1.2"
    implementation "com.google.android.gms:play-services-measurement-sdk-api:20.1.2"
    implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1"
    implementation "androidx.annotation:annotation:1.7.1"
}
