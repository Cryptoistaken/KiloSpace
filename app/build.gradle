apply plugin: 'com.android.application'

android {
    // Android 16 (API 36) support is via lib/ native patches (docs/FIXES.md) — compileSdk 34
    // keeps AGP 7.4.2 compatible. targetSdk 33 until Aug 2026 Play deadline requires 36.
    compileSdk 34
    defaultConfig {
        applicationId "io.va.exposed64"
        minSdkVersion 21
        targetSdkVersion 33 // TODO Aug 2026: bump to 36 (compileSdk 36, targetSdk 36) per Play API36 deadline
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled false
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    // Optional persistent signing via CI secrets — falls back to debug so local/PR builds pass.
    def env = { name -> def v = System.getenv(name); (v != null && v.length() > 0) ? v : null }
    def ksFile = env('KILO_KEYSTORE_FILE')
    def usePersistentSigning = ksFile != null && new File(ksFile).exists() &&
            env('KILO_KEYSTORE_PASSWORD') != null && env('KILO_KEY_ALIAS') != null && env('KILO_KEY_PASSWORD') != null

    signingConfigs {
        release {
            if (usePersistentSigning) {
                storeFile file(ksFile)
                storePassword env('KILO_KEYSTORE_PASSWORD')
                keyAlias env('KILO_KEY_ALIAS')
                keyPassword env('KILO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig = usePersistentSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    splits {
        abi {
            // CI sets -Pabi=<target> for fast branch pushes (arm64-v8a only); tags build all.
            def requestedAbi = project.findProperty('abi')
            enable true
            reset()
            if (requestedAbi) {
                include requestedAbi
                universalApk = false
            } else {
                include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                universalApk = true
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    aaptOptions{
        cruncherEnabled = false
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    // APK output naming: VirtualApp-<version>-<abi>.apk
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: 'universal'
            output.outputFileName = "VirtualApp-${variant.versionName}-${abi}.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':lib')

    //Android Lib
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:support-compat:28.0.0'
    implementation 'com.android.support:support-core-utils:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    //Promise Support
    implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'
    // ThirdParty
    implementation 'com.jonathanfinerty.once:once:1.0.3'

    implementation 'com.kyleduo.switchbutton:library:1.4.6'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    //Glide
    implementation ('com.github.bumptech.glide:glide:4.8.0') {
        exclude(group: "com.android.support")
    }
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
}
