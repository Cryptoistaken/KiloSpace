name: Build KiloSpace from Decompiled

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      decompile:
        description: 'Decompile XAPK to decompiled/ (first run)'
        required: false
        default: 'false'
        type: choice
        options: [ 'true', 'false' ]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install apktool & jadx
        run: |
          # Use committed tools/apktool_2.9.3.jar to match local (AGENTS.md); fallback wget 2.9.3 specifically
          if [ -f "tools/apktool_2.9.3.jar" ]; then echo "using tools/apktool_2.9.3.jar"; cp tools/apktool_2.9.3.jar /usr/local/bin/apktool.jar; else wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar; fi
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip -O /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          /opt/jadx/bin/jadx --version
          java -jar /usr/local/bin/apktool.jar --version || apktool --version

      - name: Decompile XAPK to decompiled/ (if needed)
        env:
          DECOMPILE: ${{ inputs.decompile }}
        run: |
          if [ "$DECOMPILE" = "true" ] || [ ! -d "decompiled" ]; then
            echo "Decompiling apks/MultiCloner_1.2.5.10.xapk -> decompiled/"
            rm -rf /tmp/xapk && mkdir -p /tmp/xapk
            unzip -q apks/MultiCloner_1.2.5.10.xapk -d /tmp/xapk
            echo "XAPK contents:"; ls -lh /tmp/xapk
            BASE_APK=$(find /tmp/xapk -name "com.multiaccounts.cloneapps.apk" | head -1)
            echo "Base APK: $BASE_APK"
            rm -rf decompiled
            mkdir -p decompiled
            echo "apktool d..."
            apktool d "$BASE_APK" -o decompiled/apktool -f 2>&1 | tail -20
            echo "jadx d..."
            /opt/jadx/bin/jadx -d decompiled/jadx "$BASE_APK" 2>&1 | tail -20
            echo "Copy vir.apk engine"
            unzip -p "$BASE_APK" assets/vir.apk > decompiled/vir.apk 2>&1 && ls -lh decompiled/vir.apk || echo "no vir"
            echo "Decompiled done - commit if new"
            ls -lh decompiled/ | head -20
          else
            echo "decompiled/ exists, skipping decompile"
            ls -lh decompiled/ | head -20
          fi

      - name: Build modified APK from decompiled/apktool
        run: |
          if [ -d "decompiled/apktool" ]; then
            echo "Rebuilding from decompiled/apktool (UI mods here)..."
            rm -rf decompiled/apktool/build
            sed -i 's/ android:pageSizeCompat="[^"]*"//g' decompiled/apktool/AndroidManifest.xml || true
            sed -i 's/ android:enableOnBackInvokedCallback="[^"]*"//g' decompiled/apktool/AndroidManifest.xml || true
            echo "Fixed manifest pageSizeCompat"
            if [ -f "tools/apktool_2.9.3.jar" ]; then JAR="tools/apktool_2.9.3.jar"; else JAR="/usr/local/bin/apktool.jar"; fi
            echo "Building with $JAR (local: java -jar tools/apktool_2.9.3.jar b decompiled/apktool)"
            java -jar "$JAR" b decompiled/apktool -o /tmp/rebuilt.apk 2>&1 | tail -30
            echo "Signing with debug key..."
            keytool -genkey -v -keystore /tmp/debug.jks -storepass android -alias androiddebugkey -keypass android -dname "CN=Debug" -keyalg RSA -validity 10000 2>&1 | tail -5 || echo "key exists"
            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign -type f | head -1)
            echo "zipalign $ZIPALIGN -f 4 /tmp/rebuilt.apk /tmp/zip.apk"
            "$ZIPALIGN" -f 4 /tmp/rebuilt.apk /tmp/zip.apk 2>&1 | tail -10
            APKSigner=$(find $ANDROID_HOME/build-tools -name apksigner -type f | head -1)
            echo "apksigner $APKSigner sign --ks /tmp/debug.jks --out apks/final.apk /tmp/zip.apk"
            mkdir -p apks
            "$APKSigner" sign --ks /tmp/debug.jks --ks-pass pass:android --key-pass pass:android --out apks/final.apk /tmp/zip.apk 2>&1 | tail -10 || echo "sign via jarsigner"
            if [ ! -f apks/final.apk ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore /tmp/debug.jks -storepass android /tmp/zip.apk androiddebugkey 2>&1 | tail -10
              cp /tmp/zip.apk apks/final.apk
            fi
            ls -lh apks/final.apk /tmp/rebuilt.apk /tmp/zip.apk
            cp apks/final.apk KiloSpace-v1.2.5.10-universal.apk
            mkdir -p app/build/outputs/apk/release
            cp apks/final.apk app/build/outputs/apk/release/KiloSpace-v1.2.5.10-universal.apk
            ls -lh KiloSpace-*.apk app/build/outputs/apk/release/
          else
            echo "No decompiled/apktool found - run workflow with decompile=true first"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: |
            apks/final.apk
            KiloSpace-v1.2.5.10-universal.apk
            app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@46312ac3ccfbc86e87f4d355f6de74d53ac23d129 # v2.3.4
        with:
          files: KiloSpace-v1.2.5.10-universal.apk
          generate_release_notes: true

      - name: Commit decompiled if new
        if: inputs.decompile == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add decompiled/ 2>&1 | head -20 || true
          git diff --cached --stat | head -30
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "KiloSpace: store decompiled MultiCloner 1.2.5.10 (apktool + jadx) for UI modify" 2>&1 | head -10
            git push origin HEAD:main 2>&1 | head -10
          else
            echo "No decompiled changes"
          fi
