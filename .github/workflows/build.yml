name: Build APK
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install NDK 25.1.8937393
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/25.1.8937393"
          if [ -d "$NDK_DIR" ]; then echo "NDK present"; else sdkmanager "ndk;25.1.8937393" --sdk_root=$ANDROID_HOME; fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: ./gradlew assembleRelease --warning-mode all
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
