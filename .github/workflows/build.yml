name: Build APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set git init default branch to master
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --- Install NDK only if not already pre-installed on runner ---
      - name: Install NDK (skip if present)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/21.4.7075529"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 21.4.7075529 already present, skipping install"
          else
            echo "NDK not found, installing..."
            sdkmanager "ndk;21.4.7075529" --sdk_root=$ANDROID_HOME
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ks/kiloclone-release.jks"
          fi

      # --- Build: arm64-v8a only on push to master; all ABIs on tags ---
      - name: Build Release APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag push — building all ABIs"
            ./gradlew assembleRelease --warning-mode all
          else
            echo "Branch push — building arm64-v8a only"
            ./gradlew assembleRelease -Pabi=arm64-v8a --warning-mode all
          fi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
          KILO_KEYSTORE_FILE: ${{ runner.temp }}/ks/kiloclone-release.jks
          KILO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KILO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KILO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Compute version code
        id: vc
        run: echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      # Append the app version to the APK filenames (read from the built APK
      # itself so tag builds and branch builds always get the right name).
      - name: Rename APK with version name
        run: |
          cd app/build/outputs/apk/release
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          VN=$($AAPT dump badging "$(ls *.apk | head -n 1)" 2>/dev/null \
            | grep -oP "versionName='\K[^']+" | head -n 1)
          for f in *.apk; do
            mv -f "$f" "${f%.apk}-v${VN}.apk"
          done
          echo "Renamed APKs to:"
          ls -1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Build a plain-text changelog from commits since the last release tag —
      # no hardcoded boilerplate, no GitHub diff URLs.
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "$PREV..HEAD")
          else
            LOG=$(git log --oneline --no-merges -20)
          fi
          {
            echo "KiloClone build v${{ steps.vc.outputs.code }}"
            echo ""
            echo "What's new in this version:"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > changelog.md
          echo "Changelog:"
          cat changelog.md

      # Publish only on real branch pushes (not PRs, not tag-triggered runs —
      # tag pushes would create a new tag each run and loop releases).
      - name: Publish GitHub Release (v${{ steps.vc.outputs.code }})
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vc.outputs.code }}
          name: v${{ steps.vc.outputs.code }}
          body_path: changelog.md
          files: app/build/outputs/apk/release/*.apk
